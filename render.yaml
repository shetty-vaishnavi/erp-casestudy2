services:
  # Backend API on Render (Node.js)
  - type: web
    name: erp-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npx tsx seed.ts
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        value: supersecret_erp_casestudy_key
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production

  # Frontend static site on Render
  - type: web
    name: erp-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && REACT_APP_API_URL=https://erp-backend.onrender.com/api npm run build
    staticPublishPath: build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
